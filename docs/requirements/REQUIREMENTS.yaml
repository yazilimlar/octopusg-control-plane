requirements:
- id: OG-GOV-001
  title: Source-cited OctopusG specification pack
  plane: GOVERNANCE
  milestone: B0
  priority: MVP
  status: IMPLEMENTED
  risk: LOW
  source:
  - S1#canonical-next-step
  - S1#claude-architecture-sprint-prompt
  - S1#system-architecture
  - S1#development-roadmap
  - S1#final-decisions-carried-forward
  - S2#next-step-and-completeness
  - S2#specification-pack-and-requirement-families
  - S3#change-1--sources-must-be-in-the-repo
  dependencies: []
  acceptance:
  - docs/00–10, ADR-0001…0005, REQUIREMENTS.yaml, TRACEABILITY.md and SESSION_BRIEF.md exist.
  - Every requirement and capability cites at least one resolvable source in docs/sources/.
  - The five planes are defined, including the meaning of Data Plane and State Store.
  tests:
  - scripts/validate-spec.mjs
- id: OG-GOV-002
  title: Specification validator and generated traceability
  plane: GOVERNANCE
  milestone: B0
  priority: MVP
  status: IMPLEMENTED
  risk: LOW
  source:
  - S1#claude-architecture-sprint-prompt
  - S3#change-1--sources-must-be-in-the-repo
  dependencies:
  - OG-GOV-001
  acceptance:
  - '`npm run validate:spec` checks YAML syntax, duplicate IDs, required fields, enums, dependency existence, cycles
    and milestone order, source anchors, internal Markdown links, capability coverage, milestone coverage, requirement
    IDs mentioned in docs, and staleness of generated sections.'
  - '`npm run spec:write` regenerates TRACEABILITY.md, the capability table and the SESSION_BRIEF status block.'
  - The validator uses only dependencies already in package-lock.json.
  tests:
  - scripts/validate-spec.mjs
- id: OG-GOV-003
  title: AI session guardrails in the repository
  plane: GOVERNANCE
  milestone: B0
  priority: MVP
  status: IMPLEMENTED
  risk: MEDIUM
  source:
  - S2#owner-request
  - S2#session-startup-protocol
  - S2#claude-and-gpt-collaboration
  - S1#ai-collaboration-model
  - S3#session-setup-guidance
  dependencies:
  - OG-GOV-001
  acceptance:
  - CLAUDE.md states identity, authoritative files, rules and prohibited actions, and imports SESSION_BRIEF.md.
  - .claude/settings.json denies push, remote changes, provider CLIs, network tools, dependency installs and secret-file
    reads.
  - .claude/settings.local.json is git-ignored.
  tests:
  - scripts/validate-spec.mjs
- id: OG-GOV-004
  title: Work-package evidence records
  plane: GOVERNANCE
  milestone: v0.2
  work_package: WP-11
