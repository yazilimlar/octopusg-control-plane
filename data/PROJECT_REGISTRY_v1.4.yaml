# =============================================================================
# FCC PRIVATE REMOTE — BLOCKED
# =============================================================================

fcc_remote_blockers:
  status: "BLOCKED — --fcc-private-remote must not be cleared"
  raised_by: "Owner (item 10), confirmed by Claude at Gate 2D"
  defects:
    - id: "origin-substring-match"
      severity: "HIGH"
      detail: >-
        The existing-origin test globs the raw URL for *yazilimlar/financial-command-center*. That
        substring also matches .../yazilimlar/financial-command-center-public.git and hostile
        look-alike hosts. A plausible accident passes the gate.
      required_fix: >-
        Normalise SSH (git@host:owner/repo.git) and HTTPS (https://host/owner/repo.git) forms to a
        canonical host/owner/repo triple with any .git suffix stripped, and require EXACT equality
        against github.com/yazilimlar/financial-command-center — host included.

    - id: "secret-scan-wrong-set"
      severity: "HIGH"
      detail: >-
        F1c walks the FILESYSTEM and matches on FILENAME. A push sends TRACKED CONTENT across all
        history reachable from HEAD. Consequences, both directions: a gitignored .env blocks the
        push though it would never be sent (false positive that trains the owner to override the
        gate); a service-role key inside a tracked .ts or .md file passes untouched (the false
        negative that matters); a secret present in commit d563ac76 and removed later is still
        pushed, because a push sends history; and .next/ build output is walked for no reason.
      required_fix: >-
        Scan what git would actually send — tracked content at every commit reachable from HEAD —
        for CONTENT patterns (eyJ JWT prefixes, sk_live_, AKIA, ghp_, service_role, PEM BEGIN
        PRIVATE KEY headers, long high-entropy strings). Report paths and match counts only.
        NEVER print a matched value.
  gate_2d_observation: >-
    A read of the FCC tree found zero files matching the current gate's extension list outside
    node_modules/ and .git/. That is a statement about FILENAMES only, and the listing hit the
    file bridge's 2000-entry cap, so it is not a complete enumeration. It is NOT a clean bill of
    health and must not be cited as one.
  clearance_condition: "Both defects corrected, re-tested, and reviewed. Until then no repository is created and nothing is pushed."

